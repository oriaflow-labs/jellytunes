name: Verify macOS code signature
description: >-
  Runs scripts/verify-mac-codesign.sh against the .dmg produced by
  electron-builder and fails the step if the packaged .app is unsigned or its
  resources aren't sealed (ORAIN-0665). Shared by build-test.yml and
  release.yml so the check is defined once.

runs:
  using: composite
  steps:
    - name: Run verify-mac-codesign.sh
      shell: bash
      run: "\"$GITHUB_WORKSPACE/scripts/verify-mac-codesign.sh\""
