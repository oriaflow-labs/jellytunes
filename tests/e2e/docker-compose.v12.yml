name: jellytunes-e2e-v12

services:
  jellyfin:
    image: jellytunes-e2e:1-v12
    container_name: jellytunes-e2e-v12
    ports:
      - '8097:8096'
    volumes:
      - ./fixtures/music:/media/music:ro
    healthcheck:
      # Jellyfin listens on 8096 *inside* the container; 8097 is only the host
      # mapping. The healthcheck runs in-container, so it must hit 8096.
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8096/System/Info/Public']
      interval: 2s
      timeout: 3s
      retries: 15
