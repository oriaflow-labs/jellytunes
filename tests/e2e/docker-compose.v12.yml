services:
  jellyfin:
    image: jellytunes-e2e:1-v12
    container_name: jellytunes-e2e-v12
    ports:
      - '8097:8096'
    volumes:
      - ./fixtures/music:/media/music:ro
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8097/System/Info/Public']
      interval: 2s
      timeout: 3s
      retries: 15
